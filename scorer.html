<body class="sk-page">
  <div class="sky" aria-hidden="true"></div>
  <main class="wrap">
    <header class="brand"><p class="eyebrow">SSC only</p><h1>Scorer</h1><p class="sub">Sportfest 2026</p></header>
    <p class="sk-who" id="who" hidden></p>

    <section id="keyScreen" class="screen panel">
      <h2>Log in</h2>
      <form id="keyForm">
        <label>Username<input id="userInput" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="e.g. score-1" required></label>
        <label>PIN<input id="keyInput" type="text" inputmode="numeric" autocomplete="off" maxlength="6"></label>
        <button id="loginBtn" class="btn" type="submit"><span>Log in</span></button>
        <p id="keyMsg" class="msg" role="status"></p>
      </form>
      <button id="installBtn" class="btn ghost install-btn" type="button" hidden>Install Scorer app</button>
      <p id="installTip" class="install-tip" hidden>To install on iPhone: tap <b>Share</b>, then <b>Add to Home Screen</b>.</p>
    </section>

    <section id="listScreen" class="screen panel" hidden>
      <h2 id="listTitle">Your games</h2>
      <p class="sk-partner" id="partner"></p>
      <div class="sk-filter" id="filter"></div>
      <div class="sk-list" id="list"></div>
      <p id="listMsg" class="msg" role="status"></p>
      <div class="row"><a class="btn ghost" href="scoreboard.html" target="_blank" rel="noopener">Open scoreboard</a><button id="logoutBtn" class="btn ghost" type="button">Log out</button></div>
    </section>

    <section id="playScreen" class="screen panel" hidden>
      <p class="sk-ev" id="pEv"></p>
      <p class="sk-series" id="pSeries"></p>
      <div class="sk-per" id="pPer"></div>
      <p class="sk-call" id="pCall"></p>
      <p class="sk-warn" id="pWarn" role="alert" hidden></p>
      <div class="sk-board"><div class="sk-team" id="tA"></div><div class="sk-team" id="tB"></div></div>
      <button id="undoBtn" class="sk-undo" type="button" hidden>↶ Undo last</button>
      <p class="sk-sync" id="sync" role="status"></p>
      <div class="row"><button id="backBtn" class="btn ghost" type="button">Back to list</button><button id="endBtn" class="btn" type="button" style="background:#8e2a2a"><span>End match</span></button></div>
    </section>

    <section id="waitScreen" class="screen panel" hidden>
      <h2 id="wTitle">Waiting for your partner</h2>
      <div class="sk-wait"><span class="sk-spin" aria-hidden="true"></span><p id="wText"></p></div>
      <div class="sk-cmp" id="wCmp"></div>
      <div class="row"><button id="wFix" class="btn ghost" type="button">Back to scoring</button><button id="wList" class="btn ghost" type="button">Games list</button></div>
      <p id="wMsg" class="msg" role="status"></p>
    </section>

    <section id="endScreen" class="screen panel" hidden>
      <h2 id="eTitle">End match?</h2>
      <div class="sk-win"><img id="eCrest" alt=""><h3 id="eName"></h3><div class="fs" id="eScore"></div><p class="hint" id="eHint"></p></div>
      <div class="sk-award" id="eAward"></div>
      <div class="row"><button id="eBack" class="btn ghost" type="button">Back to scoring</button><button id="eOk" class="btn" type="button"><span>Confirm</span></button></div>
      <p id="eMsg" class="msg" role="status"></p>
    </section>
  </main>
  <script src="config.js?v=20261109041022"></script>
  <script src="codeboxes.js?v=20261109041022"></script>
  <script src="scorer.js?v=20261109041022"></script>
  <script src="pwa.js?v=20261109041022"></script>
</body>
</html>
