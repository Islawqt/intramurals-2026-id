<!doctype html>
<html lang="en"><head><meta charset="utf-8">
  <meta name="app-version" content="20261112121207">
<meta name="robots" content="noindex">
<title>Sportfest 2026 MLBB Scene</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&family=EB+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* 1920×1080 full-screen scenes for OBS: ?scene=wait (before a game) or ?scene=pause (game paused). Opaque, Hogwarts style. */
:root{--gold:#c9a24a;--gold2:#f1d27a;--parch:#f3e6c6;--ca:#9c1a1c;--cb:#141414;--ta:#e3b52a;--tb:#f39a2b;
  --gilt:linear-gradient(135deg,#5e3f12 0%,#c9a24a 18%,#fff1bd 30%,#d4ad55 42%,#7a5518 55%,#e9c96d 70%,#fff3c9 78%,#a77c2c 90%,#5e3f12 100%)}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0d0805;font-family:'EB Garamond',serif;color:var(--parch)}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 60% 70% at 20% 55%,color-mix(in srgb,var(--ca) 55%,transparent),transparent 70%),
  radial-gradient(ellipse 60% 70% at 80% 55%,color-mix(in srgb,var(--cb) 55%,transparent),transparent 70%),
  radial-gradient(ellipse at 50% 40%,#3a2614 0,#1a0f08 55%,#080503 100%)}
.bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.75) 100%)}
.castle{position:absolute;left:50%;bottom:-60px;width:900px;transform:translateX(-50%);opacity:.09;filter:sepia(1) brightness(1.4);-webkit-mask:radial-gradient(ellipse 50% 50% at 50% 55%,#000 35%,transparent 72%);mask:radial-gradient(ellipse 50% 50% at 50% 55%,#000 35%,transparent 72%)}
.rays{position:absolute;left:50%;top:50%;width:1500px;height:1500px;transform:translate(-50%,-50%);border-radius:50%;
  background:repeating-conic-gradient(rgba(255,222,140,.07) 0 4deg,transparent 4deg 12deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 62%);mask:radial-gradient(circle,#000 10%,transparent 62%);animation:spin 120s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.frame{position:absolute;inset:26px;border:2px solid rgba(201,162,74,.55);border-radius:6px;pointer-events:none}
.frame::before{content:'';position:absolute;inset:8px;border:1px solid rgba(201,162,74,.3);border-radius:3px}
.dust{position:absolute;inset:0;overflow:hidden}
.dust i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px 2px rgba(255,190,90,.8);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{opacity:0;transform:translateY(0)}10%{opacity:.9}90%{opacity:.6}100%{opacity:0;transform:translateY(-1000px)}}

/* top: event + logos */
.top{position:absolute;top:62px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.logos{display:flex;align-items:center;gap:22px}
.logos img{height:64px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.logos i{width:2px;height:52px;background:var(--gold);opacity:.6}
.logos .crest{height:84px}
.ev{font:700 22px Cinzel,serif;letter-spacing:.42em;color:var(--gold2);text-indent:.42em}
.ev small{display:block;margin-top:4px;font:italic 22px 'IM Fell English',serif;letter-spacing:.02em;text-indent:0;color:#cbb88f;text-align:center}

/* matchup */
.mu{position:absolute;top:268px;left:0;right:0;display:grid;grid-template-columns:1fr 300px 1fr;align-items:center}
.side{display:flex;flex-direction:column;align-items:center;gap:20px}
.cw{position:relative;width:300px;height:340px;display:grid;place-items:center}
.cw::before{content:'';position:absolute;inset:-60px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 70%,transparent) 0,transparent 65%);opacity:.75;animation:glow 3.5s ease-in-out infinite}
.side.b .cw::before{animation-delay:-1.75s}
@keyframes glow{50%{opacity:1;transform:scale(1.06)}}
.cw img{position:relative;max-width:270px;max-height:330px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.7))}
.plate{position:relative;min-width:520px;padding:16px 40px;text-align:center;font:700 40px Cinzel,serif;letter-spacing:.12em;color:var(--tx);white-space:nowrap;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 75%,#fff) 0,var(--c) 40%,color-mix(in srgb,var(--c) 60%,#000) 100%);
  border-top:2px solid #fff1bd;border-bottom:3px solid #c9a24a;box-shadow:0 10px 24px rgba(0,0,0,.6);text-shadow:0 2px 3px rgba(0,0,0,.6)}
.plate::before,.plate::after{content:'';position:absolute;top:50%;width:16px;height:16px;transform:translateY(-50%) rotate(45deg);background:var(--gilt);box-shadow:0 0 0 2px #2b1d10}
.plate::before{left:-9px}.plate::after{right:-9px}
.pips{display:flex;gap:14px;min-height:22px}
.pip{width:22px;height:22px;transform:rotate(45deg);border:2.5px solid var(--gold);background:rgba(0,0,0,.35)}
.pip.w{background:var(--gold2);border-color:#fff7d6;box-shadow:0 0 14px var(--gold2)}
.vs{display:flex;flex-direction:column;align-items:center;gap:6px}
.vs b{font:700 120px 'Cinzel Decorative',serif;line-height:1;background:var(--gilt);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 6px rgba(0,0,0,.7))}
.vs .sr{font:700 46px Cinzel,serif;letter-spacing:.1em;color:var(--parch)}

/* bottom: stage + status */
.bot{position:absolute;left:0;right:0;bottom:70px;display:flex;flex-direction:column;align-items:center;gap:16px}
.stage{display:flex;align-items:center;gap:22px;font:700 34px Cinzel,serif;letter-spacing:.14em;color:var(--parch)}
.stage i{width:14px;height:14px;transform:rotate(45deg);background:var(--gold2);box-shadow:0 0 10px var(--gold2)}
.stage em{font-style:normal;color:var(--gold2)}
.ban{position:relative;display:flex;align-items:center;justify-content:center;min-width:760px;height:92px;padding:0 70px;
  background:linear-gradient(180deg,#a51c1c,#6e0f0f 60%,#4e0909);box-shadow:0 0 0 3px #d4ad55,0 0 0 6px #2b1d10,0 14px 30px rgba(0,0,0,.7)}
.ban::before,.ban::after{content:'';position:absolute;top:14px;width:70px;height:64px;background:linear-gradient(180deg,#7a1414,#3e0606);z-index:-1;border-top:3px solid #d4ad55;border-bottom:3px solid #d4ad55}
.ban::before{left:-48px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,32% 50%)}
.ban::after{right:-48px;clip-path:polygon(0 0,100% 0,68% 50%,100% 100%,0 100%)}
.ban b{font:700 50px 'Cinzel Decorative',serif;letter-spacing:.14em;background:linear-gradient(100deg,#c9a24a 0%,#fff3c9 20%,#e9c96d 35%,#c9a24a 50%,#fff3c9 70%,#c9a24a 100%) 0 0/200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 4s linear infinite}
@keyframes sheen{to{background-position:-200% 0}}
.sub{font:italic 34px 'IM Fell English',serif;color:#e9d6a8;text-shadow:0 2px 4px rgba(0,0,0,.7)}
.sub .dots i{display:inline-block;animation:dot 1.4s infinite}
.sub .dots i:nth-child(2){animation-delay:.2s}.sub .dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.2}30%{opacity:1}}
.cd{font:700 64px Cinzel,serif;letter-spacing:.12em;color:var(--gold2);text-shadow:0 0 18px rgba(241,210,122,.45)}

/* pause: dim the matchup, hourglass + pulsing banner */
body.pause .mu{filter:saturate(.55) brightness(.7)}
body.pause .ban{background:linear-gradient(180deg,#2c2c34,#18181e 60%,#0e0e12);animation:pulse 2.4s ease-in-out infinite}
body.pause .ban::before,body.pause .ban::after{background:linear-gradient(180deg,#24242a,#0e0e12)}
@keyframes pulse{50%{box-shadow:0 0 0 3px #f1d27a,0 0 0 6px #2b1d10,0 0 40px 10px rgba(241,210,122,.35)}}
.hg{display:none;width:70px;height:92px;margin-right:26px}
body.pause .hg{display:block;animation:flip 4s ease-in-out infinite}
@keyframes flip{0%,80%{transform:rotate(0)}100%{transform:rotate(180deg)}}
body.ck{background:repeating-conic-gradient(#3a3a3a 0 25%,#2c2c2c 0 50%) 0 0/40px 40px}
</style></head>
<body>
<div class="bg"></div>
<img class="castle" src="assets/intro/school.webp" alt="">
<div class="rays"></div>
<div class="dust" id="dust"></div>
<div class="frame"></div>

<div class="top">
  <div class="logos"><img id="sti" alt="STI"><i></i><img class="crest" src="assets/og/crest-web.webp" alt="Sportfest 2026"><i></i><img id="ssc" alt="SSC"></div>
  <div class="ev">SPORTFEST 2026<small>Mobile Legends · STI College Valencia</small></div>
</div>

<div class="mu">
  <div class="side a" id="sA"><div class="cw"><img id="cA" alt=""></div><div class="plate" id="pA"></div><div class="pips" id="wA"></div></div>
  <div class="vs"><b>VS</b><span class="sr" id="sr"></span></div>
  <div class="side b" id="sB"><div class="cw"><img id="cB" alt=""></div><div class="plate" id="pB"></div><div class="pips" id="wB"></div></div>
</div>

<div class="bot">
  <div class="stage" id="stage"></div>
  <div class="ban"><svg class="hg" viewBox="0 0 70 92"><path d="M8 4h54M8 88h54" stroke="#f1d27a" stroke-width="6" stroke-linecap="round"/><path d="M14 8c0 22 16 28 16 38S14 62 14 84h42c0-22-16-28-16-38S56 30 56 8z" fill="none" stroke="#f1d27a" stroke-width="4"/><path d="M22 76c4-8 10-10 13-10s9 2 13 10z" fill="#f1d27a"/><path d="M24 18h22c-3 8-8 12-11 14-3-2-8-6-11-14z" fill="#f1d27a" opacity=".7"/></svg><b id="head"></b></div>
  <div class="sub" id="sub"></div>
</div>

<script src="config.js?v=20261112121207"></script>
<script>
// Full-screen OBS scenes. ?scene=wait|pause · manual: ?a=Phoenix&b=Gryffindor&stage=Grand Final&game=1&bo=5&wa=0&wb=0&at=13:00&msg=…
// No a/b: live mode, follows the tournament (the game being played, else the next one). ?ck=1 checkerboard (preview only).
const Q = new URLSearchParams(location.search), $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const SCENE = Q.get('scene') === 'pause' ? 'pause' : 'wait', SPORT = Q.get('sport') || 'mlbb';
document.body.classList.add(SCENE);
$('#sti').src = CONFIG.LOGOS.sti; $('#ssc').src = CONFIG.LOGOS.ssc;
$('#dust').innerHTML = Array.from({ length: 40 }, () => `<i style="left:${Math.random() * 1920}px;animation-duration:${(9 + Math.random() * 9).toFixed(1)}s;animation-delay:${(-Math.random() * 18).toFixed(1)}s"></i>`).join('');
// overlay house colors (same as the in-game overlay)
const OV = { Gryffindor: { c: '#9c1a1c', tx: '#fff7e0' }, Slytherin: { c: '#1f5a35', tx: '#f2f2f2' }, Ravenclaw: { c: '#1f3f8f', tx: '#f6ecd8' },
  Hufflepuff: { c: '#e8b923', tx: '#1a1206' }, Dragon: { c: '#9a7fd0', tx: '#ffffff' }, Phoenix: { c: '#141414', tx: '#f39a2b' } };
const ov = t => OV[String(houseName(t)).split(' ')[0]] || { c: (houseStyle(t) || {}).primary || '#555', tx: '#fff' };
const f12 = t => { if (!t) return ''; const [h, m] = String(t).split(':').map(Number); return `${(h % 12) || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
const stageName = l => String(l || 'Match').replace(/^Round (\d+) · Game \d+$/, 'Group Stage · Round $1');
let data = null, sig = '', at = Q.get('at') || '';

function paint(m) {
  const s = JSON.stringify(m); if (s === sig) return; sig = s;
  const need = Math.floor(m.bestOf / 2) + 1, game = Math.min(m.bestOf, m.game || (m.wa + m.wb + 1));
  [['a', 'A', m.wa], ['b', 'B', m.wb]].forEach(([k, K, w]) => {
    const t = m[k], o = ov(t);
    document.documentElement.style.setProperty('--c' + k, o.c);
    $('#s' + K).style.setProperty('--c', o.c); $('#p' + K).style.setProperty('--c', o.c); $('#p' + K).style.setProperty('--tx', o.tx);
    $('#c' + K).src = (houseStyle(t) || {}).emblem || 'assets/og/crest-web.webp';
    $('#p' + K).textContent = String(houseName(t)).toUpperCase();
    $('#w' + K).innerHTML = need > 1 ? Array.from({ length: need }, (_, i) => `<i class="pip${i < w ? ' w' : ''}"></i>`).join('') : '';
  });
  $('#sr').textContent = m.bestOf > 1 ? `${m.wa} – ${m.wb}` : '';
  $('#stage').innerHTML = `${esc(stageName(m.label).toUpperCase())}<i></i><em>GAME ${game}</em>${m.bestOf > 1 ? `<i></i>BEST OF ${m.bestOf}` : ''}`;
  if (SCENE === 'pause') { $('#head').textContent = 'GAME PAUSED'; $('#sub').textContent = Q.get('msg') || 'Technical pause · we’ll be right back'; }
  else { $('#head').textContent = 'UP NEXT'; at = Q.get('at') || (m.status === 'Scheduled' ? m.time : '') || ''; tick(); }
}
// waiting screen: countdown to the start time if there is one, else "starting soon…"
function tick() {
  if (SCENE !== 'wait') return;
  const msg = Q.get('msg');
  if (at && /^\d{1,2}:\d{2}$/.test(at)) {
    const [h, mi] = at.split(':').map(Number), now = new Date(), t = new Date(now); t.setHours(h, mi, 0, 0);
    const left = Math.round((t - now) / 1000);
    if (left > 0 && left < 6 * 3600) {
      const hh = Math.floor(left / 3600), mm = Math.floor(left % 3600 / 60), ss = left % 60;
      $('#sub').innerHTML = `${msg ? esc(msg) + ' · ' : ''}Starts at ${esc(f12(at))} · <span class="cd">${hh ? hh + ':' : ''}${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}</span>`; return;
    }
  }
  $('#sub').innerHTML = `${esc(msg || 'The match is about to begin')}<span class="dots"><i>.</i><i>.</i><i>.</i></span>`;
}
setInterval(tick, 1000);

function current() {
  const ms = data.matches.filter(m => m.sport === SPORT), t = (x, y) => String(x.date + x.time).localeCompare(String(y.date + y.time));
  if (Q.get('match')) return ms.find(m => m.id === Q.get('match'));
  return ms.find(m => m.status === 'Live') || ms.filter(m => m.status === 'Scheduled' && m.a && m.b).sort(t)[0] || null;
}
async function load() {
  if (Q.get('a') && Q.get('b')) {
    const bo = [1, 3, 5, 7].includes(+Q.get('bo')) ? +Q.get('bo') : 1;
    return paint({ id: 'manual', label: Q.get('stage') || 'Match', a: Q.get('a'), b: Q.get('b'), bestOf: bo, wa: Math.max(0, +Q.get('wa') || 0), wb: Math.max(0, +Q.get('wb') || 0), game: Math.max(1, +Q.get('game') || 1), status: 'Scheduled' });
  }
  if (Q.get('demo')) return paint({ id: 'd', label: 'Grand Final', a: 'Gryffindor', b: 'Phoenix', bestOf: 5, wa: 2, wb: 1, status: 'Live' });
  try { const r = await (await fetch(CONFIG.API_URL, { method: 'POST', body: '{"action":"board"}' })).json(); if (r.ok && !r.hidden) { data = r; const m = current(); if (m) paint(m); } } catch (e) {}
}
if (Q.get('ck')) document.body.classList.add('ck');
load(); if (!(Q.get('a') && Q.get('b')) && !Q.get('demo')) setInterval(load, 5000);
</script>
</body></html>
